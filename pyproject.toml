[project]
name = "fastapi-perfectionist-starter"
version = "0.1.0"
description = "Template for FastAPI applications"
requires-python = ">=3.14,<3.15"
authors = [
    {name = "TrueRou", email = "you@example.com"}
]
dependencies = [
    "alembic>=1.17.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.123.0",
    "greenlet>=3.2.0",
    "loguru>=0.7.3",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlalchemy==2.1.0b3",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "freezegun>=1.5.1",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["sqlalchemy==2.1.0b3"]
prerelease = "allow"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
